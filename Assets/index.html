<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <div class="site-nav">
      <div class="left-column">
        <div class="logo">
          <img src="images/logo/logo-header.png" alt="logo" />
        </div>
      </div>
      <div class="center-column"></div>
      <div class="right-column">
        <div class="links__wrapper">
          <div class="nav-link"><a href="index.html">Home</a></div>
          <div class="nav-link"><a href="service.html">Services</a></div>
          <div class="nav-link"><a href="About us.html">About</a></div>
          <div class="nav-link"><a href="shop.html">Shop</a></div>
          <div class="nav-link"><a href="news.html">news</a></div>
        </div>
        <div class="contact-button">
          <div class="nav-link">
            <button><a href="contact us.html">Book Now</a></button>
          </div>
        </div>
      </div>
    </div>
    <div class="hero-section">
      <div class="section">
        <article>
          <h3>Make An Appointment</h3>
          <form class="booking__form">
          <input type="text" name="name" id="name" placeholder="John Doe" />
          <input type="email" name="email" id="Email" placeholder="Email" />
          <input type="number" name="phone" id="Phone" placeholder="phone" />
          <input type="datetime-local" name="Date" id="Date" />
          <input type="button" value="Submit request" onclick="window.location.href='contact us.html'" />
          </form>
        </article>
        <h2 class="description">
          Experience the art of traditional barbering with modern style.<br />
          Book your appointment today and discover the <span class="text-amber-500">FadeCraft's</span> Cuts difference.
        </h2>
        <div class="motto">
          <h1>Where Style Meets Precision</h1>
        </div>
      </div>
    </div>
  </body>
</html>
