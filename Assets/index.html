<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FadeCraft Barbershop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/navstyles.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
     <div id="nav-placeholder"></div>
    
    <div class="hero-section">
      <section>
         <div class="motto">
          <h1 class="typing"></h1>
        </div>
        <article>
          <h3>Quick Booking</h3>
          <p class="article-sub">Fill in ypur details and we'll reach out to confirm your slot.</p>
          <form class="booking__form" id="quickform">
          <input type="text" name="name" id="name" placeholder="Your name" />
          <input type="email" name="email" id="Email" placeholder="Email" />
          <input type="tel" name="phone" id="Phone" placeholder="+254 7xx xxx xxx" />
          <input type="datetime-local" name="Date" id="Date" />
          <a href="contact us.html" class="book-btn">Book Full Appointment →</a>
          </form>
        </article>
        <h2 class="description">
          Where Nairobi's finest get their cuts.<br/>
          Classic technique. Contemporary style <span class="text-amber-500">FadeCraft's</span> Cuts difference.
        </h2>
       
     </section>
    </div>
   <div id="footer-placeholder"></div>
   <script src="javaScript/fetch.js"></script>
   <script src="javaScript/index.js"></script>
  </body>
</html>
