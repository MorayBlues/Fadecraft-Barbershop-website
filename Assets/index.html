<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/navstyles.css">
    <link rel="stylesheet" href="styles/footer.css">

  <body>
     <div id="nav-placeholder"></div>
    
    <div class="hero-section">
      <section>
         <div class="motto">
          <h1 class="typing"></h1>
        </div>
        <article>
          <h3>Make An Appointment</h3>
          <form class="booking__form">
          <input type="text" name="name" id="name" placeholder="John Doe" />
          <input type="email" name="email" id="Email" placeholder="Email" />
          <input type="number" name="phone" id="Phone" placeholder="phone" />
          <input type="datetime-local" name="Date" id="Date" />
          <input type="button" value="Submit request" onclick="window.location.href='contact us.html'" />
          </form>
        </article>
        <h2 class="description">
          Experience the art of traditional barbering with modern style.<br />
          Book your appointment today and discover the <span class="text-amber-500">FadeCraft's</span> Cuts difference.
        </h2>
       
     </section>
    </div>
   <div id="footer-placeholder"></div>
   <script src="javaScript/fetch.js"></script>
   <script src="javaScript/index.js"></script>
  </body>
</html>
