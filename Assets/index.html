<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FadeCraft Barbershop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/navstyles.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <div class="page-wrapper">
    <div id="nav-placeholder"></div>

    <div class="hero-section">
      <section>
        <div class="hero-left">
          <div class="premium-grooming">
            <span>PREMIUM GROOMING</span>
          </div>
          <div class="motto">
            <h1 class="typing"></h1>
          </div>
          <h2 class="description">
            Where Nairobi's finest get their cuts.<br />
            Classic technique. Contemporary style is
            <span class="text-amber-500">FadeCraft's</span> Cut's difference.
          </h2>
          <div class="btn-group">
            <a class="book-btn" href="contact us.html">Book Appointment ></a>
            <a class="clear-btn" href="service.html">View Services</a>
          </div>
        </div>
      </section>  
    </div>
     <section class="intro-cards">
        <div class="grid-cols1">
          <div class="cards">
            <img src="images/icons/award-solid.png" alt="">
            <h3>Expert Barbers</h3>
            <p>10+ Years Experience</p>
          </div>
          <div class="cards">
            <img src="images/icons/people-group-solid.png" alt="">
            <h3>5000+ Clients</h3>
            <p>Trusted by Thousands</p>
          </div>
          <div class="cards">
            <img src="images/icons/clock-solid.png" alt="">
            <h3>Walk-ins Welcome</h3>
            <p>Or book an appointment</p>
          </div>
        </div>
      </section>
    <div id="footer-placeholder"></div>
    <script src="javaScript/fetch.js"></script>
    <script src="javaScript/index.js"></script>
    </div>
  </body>
</html>
